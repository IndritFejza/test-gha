name: Test Output Overflow
on:
  workflow_dispatch:

jobs:
  big-output:
    runs-on: ubuntu-latest
    outputs:
      huge: ${{ steps.gen.outputs.huge }}
    steps:
      - id: gen
        run: |
          # generate ~1.1MB of output to exceed the 1MB limit
          python3 -c "print('x' * 1100000)" >> "$GITHUB_OUTPUT"
          echo "huge=$(python3 -c "print('x' * 1100000)")" >> "$GITHUB_OUTPUT"

  downstream:
    needs: big-output
    runs-on: ubuntu-latest
    steps:
      - run: echo "I ran"
