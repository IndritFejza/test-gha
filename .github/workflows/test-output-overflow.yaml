name: Test Output Overflow 1 Layer
on:
  workflow_dispatch:

jobs:
  big-output:
    runs-on: ubuntu-latest
    outputs:
      huge: ${{ steps.gen.outputs.huge }}
    steps:
      - id: gen
        run: |
          {
            echo "huge<<EOF"
            python3 -c "print('x' * 1100000)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  downstream:
    needs: big-output
    runs-on: ubuntu-latest
    steps:
      - run: echo "I ran"
