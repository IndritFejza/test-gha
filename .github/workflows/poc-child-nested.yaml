name: POC - Child Nested (3-level test - middle layer)

on:
  workflow_call:

jobs:
  worker-nested:
    name: ${{ matrix.args.name }}
    uses: ./.github/workflows/poc-grandchild.yaml
    strategy:
      fail-fast: false
      matrix:
        args:
          - name: nested-test-alpha
            param: alpha
          - name: nested-test-beta
            param: beta
    with:
      test-param: ${{ matrix.args.param }}

  # This is a regular job in the middle layer
  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Echo test param
        run: |
          echo "Scenario: Nested call (3 levels - middle layer)"
          echo "This is the middle layer worker job"
